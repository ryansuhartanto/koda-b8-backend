components:
  schemas:
    LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
      type: object
    Problem:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
      required:
      - status
      - title
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          minLength: 8
          type: string
      required:
      - email
      - name
      - password
      type: object
    TokenResponse:
      properties:
        token:
          type: string
      required:
      - token
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: suhartanto@kekkon.nexus
    name: Ryan Suhartanto
    url: https://github.com/ryansuhartanto/koda-b8-backend
  description: E-commerce API for the BeliMudah storefront.
  license:
    name: MIT
  title: BeliMudah API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid credentials
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Exchange credentials for a token
      tags:
      - auth
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid body
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Email already registered
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal error
      summary: Register an account
      tags:
      - auth
  /healthz:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Database unreachable
      summary: Liveness and database reachability
      tags:
      - meta
servers:
- url: http://localhost:3001
