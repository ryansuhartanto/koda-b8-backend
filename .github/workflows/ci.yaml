name: CI

on:
  push:

jobs:
  check:
    name: Check

    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
    env:
      GOTESTSUM_FORMAT: github-actions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('apps/go/go.sum') }}
          restore-keys: go-

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/aube
          key: aube-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: aube-

      - uses: jdx/mise-action@v4
      - run: aube ci
      - run: go -C apps/go mod tidy -diff

      - name: Vet, lint and format
        run: mise run check

      - name: Test
        run: mise run test

      - name: Check specs are current
        run: |
          mise run docs
          git diff --exit-code
